services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jygy
      POSTGRES_PASSWORD: jygy_secret
      POSTGRES_DB: jing_ying_gui_yin
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jygy -d jing_ying_gui_yin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://jygy:jygy_secret@db:5432/jing_ying_gui_yin
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      AUTH_MODE: mock
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      DATA_ROOT: /app/data
      UPLOAD_ROOT: /app/uploads
      EXPORT_ROOT: /app/exports
      WORKSPACE_ROOT: /app/workspace
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./workspace:/app/workspace
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
